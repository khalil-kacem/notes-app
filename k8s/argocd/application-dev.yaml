apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/khalil-kacem/notes-app.git
    targetRevision: dev
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
