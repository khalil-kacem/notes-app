apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'notes-app-backend'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - notes-app
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: dev-backend|prod-backend
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
