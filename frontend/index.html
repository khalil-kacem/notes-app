<!DOCTYPE html>
<html>
<head>
  <title>Notes App</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
    input, textarea { width: 100%; margin: 5px 0; padding: 10px; border: 1px solid #ddd; }
    button { padding: 12px 24px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0056b3; }
    .note { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 4px; }
    .note h3 { margin: 0 0 10px 0; }
    #error { color: red; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>📝 Notes App</h1>
  <div id="error"></div>
  <input id="title" placeholder="Title">
  <textarea id="content" placeholder="Content" rows="3"></textarea>
  <button onclick="addNote()">Add Note</button>
  <div id="notes"></div>
  <script>
    const API = window.location.origin.replace(':8080', ':3000') + '/api/notes';
    async function loadNotes() {
      try {
        const res = await fetch(API);
        const notes = await res.json();
        document.getElementById('notes').innerHTML = notes.map(n => 
          `<div class="note"><h3>${escapeHtml(n.title)}</h3><p>${escapeHtml(n.content)}</p></div>`
        ).join('');
        document.getElementById('error').textContent = '';
      } catch (e) {
        document.getElementById('error').textContent = 'Error loading notes: ' + e.message;
      }
    }
    async function addNote() {
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      if (!title || !content) {
        document.getElementById('error').textContent = 'Title and content required';
        return;
      }
      try {
        await fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title, content}) });
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        loadNotes();
      } catch (e) {
        document.getElementById('error').textContent = 'Error adding note: ' + e.message;
      }
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    loadNotes();
  </script>
</body>
</html>
