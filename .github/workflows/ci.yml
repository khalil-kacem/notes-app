name: CI Pipeline

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install
      - run: cd backend && npm test
      - run: cd backend && npx eslint src/

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ ! -f frontend/index.html ]; then exit 1; fi
          if [ ! -f frontend/Dockerfile ]; then exit 1; fi
          echo "Frontend valid"

  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'
      - name: Validate K8s manifests with kustomize
        run: |
          kustomize build k8s/overlays/dev/ > /dev/null
          kustomize build k8s/overlays/prod/ > /dev/null
          echo "Kustomize overlays valid"
      - name: Validate ArgoCD YAMLs
        run: |
          for f in k8s/argocd/*.yaml; do
            if [ -f "$f" ]; then
              echo "Checking $f"
              python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
            fi
          done
          echo "ArgoCD YAMLs valid"

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test-backend, validate-frontend, validate-k8s]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install
      - run: cd backend && npm test
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  security-scan-code:
    name: Security - Code & Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd backend && npm install
      - name: Run npm audit
        run: cd backend && npm audit --audit-level=moderate || true
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  security-scan-deps:
    name: Security - Dependency Scan (Trivy FS)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
      - name: Upload Trivy FS scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, validate-frontend, validate-k8s, security-scan-code]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: notes-backend:test
      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: notes-frontend:test

  security-scan-images:
    name: Security - Docker Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-docker
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: notes-backend:scan
      - name: Build frontend image for scan
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: notes-frontend:scan
      - name: Run Trivy vulnerability scanner (Backend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'notes-backend:scan'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Run Trivy vulnerability scanner (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'notes-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Upload Trivy backend scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
      - name: Upload Trivy frontend scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'

  push-docker:
    runs-on: ubuntu-latest
    needs: [build-docker, sonarqube, security-scan-images]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-backend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/notes-backend:latest
      - name: Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/notes-frontend:latest

  deploy-gitops:
    name: Deploy ArgoCD GitOps
    runs-on: ubuntu-latest
    needs: push-docker
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'
      - uses: medyagh/setup-minikube@latest
      - run: minikube start --driver=docker
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'
      - name: Install ArgoCD via Helm
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm || true
          helm repo update || true
          helm install argocd argo/argo-cd --namespace argocd --create-namespace || true
          sleep 60
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s || true
      - name: Apply ArgoCD Applications
        run: |
          kubectl apply -f k8s/argocd/
          sleep 10
          kubectl get applications -n argocd || true
      - name: Verify Deployment
        run: |
          sleep 30
          kubectl get pods -n notes-app || true
          kubectl get svc -n notes-app || true
