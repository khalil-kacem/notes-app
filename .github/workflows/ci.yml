name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install
      - run: cd backend && npm test
      - run: cd backend && npx eslint src/
