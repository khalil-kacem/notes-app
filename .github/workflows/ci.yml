name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install
      - run: cd backend && npm test
      - run: cd backend && npx eslint src/

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ ! -f frontend/index.html ]; then exit 1; fi
          if [ ! -f frontend/Dockerfile ]; then exit 1; fi
          echo "Frontend valid"

  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'
      - name: Validate K8s manifests with kustomize
        run: |
          kustomize build k8s/overlays/dev/ > /dev/null
          kustomize build k8s/overlays/prod/ > /dev/null
          echo "Kustomize overlays valid"
      - name: Validate ArgoCD YAMLs
        run: |
          for f in k8s/argocd/*.yaml; do
            if [ -f "$f" ]; then
              echo "Checking $f"
              python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
            fi
          done
          echo "ArgoCD YAMLs valid"

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test-backend, validate-frontend, validate-k8s]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install
      - run: cd backend && npm test
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, validate-frontend, validate-k8s]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: notes-backend:test
      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: notes-frontend:test

  push-docker:
    runs-on: ubuntu-latest
    needs: [build-docker, sonarqube]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-backend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/notes-backend:latest
      - name: Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/notes-frontend:latest

  deploy-gitops:
    name: Deploy ArgoCD GitOps
    runs-on: ubuntu-latest
    needs: push-docker
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'
      - uses: medyagh/setup-minikube@latest
      - run: minikube start --driver=docker
      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd || true
          kubectl apply --server-side=true -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml || \
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          sleep 60
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s || true
      - name: Apply ArgoCD Applications
        run: |
          kubectl apply -f k8s/argocd/
          sleep 10
          kubectl get applications -n argocd || true
      - name: Verify Deployment
        run: |
          sleep 30
          kubectl get pods -n notes-app || true
          kubectl get svc -n notes-app || true
