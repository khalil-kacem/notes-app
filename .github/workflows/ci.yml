name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install
      - run: cd backend && npm test
      - run: cd backend && npx eslint src/

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ ! -f frontend/index.html ]; then exit 1; fi
          if [ ! -f frontend/Dockerfile ]; then exit 1; fi
          echo "Frontend valid"

  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'
      - run: kubectl apply --dry-run=client --validate=false -k k8s/overlays/dev/
      - run: kubectl apply --dry-run=client --validate=false -k k8s/overlays/prod/

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, validate-frontend, validate-k8s]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: notes-backend:test
      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: notes-frontend:test

  push-docker:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-backend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/notes-backend:latest
      - name: Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/notes-frontend:latest
